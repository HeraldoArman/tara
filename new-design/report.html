<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TARa · Service report</title>
    <meta
      name="description"
      content="Audit-ready service report — every step, frame, deviation and override in one record."
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23171914'/%3E%3Cpath d='M9 22V11l7 7 7-7v11' stroke='%23ffffff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body class="page-report">
    <div class="bg-fx" aria-hidden="true"></div>

    <header class="topbar topbar--app">
      <a class="brand" href="index.html" aria-label="TARa home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path
              d="M9 22V11l7 7 7-7v11"
              stroke="#ffffff"
              stroke-width="2.8"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="brand__name">TARa</span>
      </a>

      <div class="wo-brief">
        <span class="wo-brief__id" id="briefId">Service report</span>
        <span class="wo-brief__device" id="briefDevice">Loading record…</span>
      </div>

      <div class="topbar__right">
        <span class="pill pill--ghost">Prototype · simulated</span>
        <a class="btn btn--ghost btn--sm" href="index.html" data-icon="arrowLeft">Work queue</a>
      </div>
    </header>

    <main class="report" id="reportRoot" aria-live="polite"></main>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/report.js"></script>
  </body>
</html>
