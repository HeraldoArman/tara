<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <meta content="#3869ed" name="theme-color">
    <title>Reconnect · TARa</title>
    <style>
    :root {
      font-family: Arial, sans-serif;
      color: #28364e;
      color-scheme: light;
      background: #f8faff;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    main {
      max-width: 410px;
      padding: 40px;
    }
    strong {
      font-size: 28px;
      color: #3869ed;
      letter-spacing: -1px;
    }
    h1 {
      margin-top: 40px;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -1px;
    }
    p {
      font-size: 14px;
      line-height: 1.8;
      color: #8392ab;
    }
    a {
      display: inline-block;
      padding: 14px 20px;
      margin-top: 18px;
      font-size: 13px;
      color: #fff;
      text-decoration: none;
      background: #3869ed;
      border-radius: 11px;
    }
    small {
      display: block;
      margin-top: 32px;
      line-height: 1.7;
      color: #9aa8bc;
    }
    </style>
  </head>
  <body>
    <main>
      <strong>TARa.</strong>
      <h1>Let’s reconnect.</h1>
      <p>
        Your procedure and evidence are saved on the server. Reconnect to load
        the latest session before continuing.
      </p>
      <a href="/">Try again</a
      ><small
        >Visual checks and step completion need a connection. Pending camera
        frames are never submitted as fresh evidence after reconnect.</small
      >
    </main>
  </body>
</html>
