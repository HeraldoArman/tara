name: Railway infrastructure plan
on:
  workflow_dispatch:
  pull_request:
    paths: [".railway/**"]
permissions:
  contents: read
jobs:
  plan:
    # Enable only after a staging-scoped token is installed. Never expose it to forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.fork == false && vars.RAILWAY_PLAN_ENABLED == 'true')
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PLAN_TOKEN }}
      RAILWAY_CALLER: skill:use-railway@1.3.7
      RAILWAY_AGENT_SESSION: tara-github-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npm install --global @railway/cli@5.71.0
      - run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Configure a staging-scoped RAILWAY_PLAN_TOKEN secret before running this workflow."
            exit 1
          fi
          railway config plan --environment staging --json > railway-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: redacted-staging-infrastructure-plan
          path: railway-plan.json
          retention-days: 7
