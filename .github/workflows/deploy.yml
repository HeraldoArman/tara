name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "nx.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_PRODUCTION_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
      RAILWAY_CALLER: skill:use-railway@1.3.7
      RAILWAY_AGENT_SESSION: tara-production-${{ github.run_id }}
      DEPLOY_BEFORE_SHA: ${{ github.event.before }}
      DEPLOY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select services and validate deployment configuration
        id: prepare
        run: python3 scripts/deploy-railway.py --prepare
      - uses: actions/setup-node@v4
        if: steps.prepare.outputs.has_changes == 'true'
        with:
          node-version: "24"
      - name: Install pinned Railway CLI
        if: steps.prepare.outputs.has_changes == 'true'
        run: npm install --global @railway/cli@5.71.0
      - name: Deploy and wait for production services
        if: steps.prepare.outputs.has_changes == 'true'
        run: python3 scripts/deploy-railway.py
