name: tara

x-server-environment: &server-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://tara:${POSTGRES_PASSWORD:-tara-local-only}@postgres:5432/tara
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
  JWT_ISSUER: tara
  JWT_EXPIRE_HOURS: "8"
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
  COOKIE_SECURE: "false"
  EVIDENCE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tara-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in the root .env file}
  S3_BUCKET: ${S3_BUCKET:-tara-evidence}
  S3_REGION: us-east-1
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-tara-agent-local}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL:-}
    init: true
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      API_INTERNAL_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    environment:
      <<: *server-environment
      SOP_OPENAI_API_KEY: ${SOP_OPENAI_API_KEY:-}
      SOP_MODEL: ${SOP_MODEL:-gpt-4.1}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    profiles: [realtime]
    command: ["python", "-m", "tara_server.agent.worker", "start"]
    environment:
      <<: *server-environment
      SERVICE_ROLE: worker
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REALTIME_MODEL: ${REALTIME_MODEL:-gpt-realtime-2.1}
      VISION_MODEL: ${VISION_MODEL:-gpt-4.1}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 300s
    restart: on-failure:5

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tara
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tara-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tara -d tara"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-tara-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in the root .env file}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
